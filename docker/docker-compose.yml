# Full stack: app (backend + frontend SPA) + postgres + minio + byparr
# Build from repo root:
#   docker compose -f docker/docker-compose.yml up --build

services:
  postgres:
    image: postgres:latest
    container_name: brotracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: brotracker
      POSTGRES_PASSWORD: brotracker
      POSTGRES_DB: brotracker
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brotracker -d brotracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: brotracker-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: brotracker-byparr
    restart: unless-stopped
    shm_size: 1gb

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: brotracker-app
    restart: unless-stopped
    ports:
      - "3101:3101"
    environment:
      PORT: "3101"
      DATABASE_URL: postgresql://brotracker:brotracker@postgres:5432/brotracker
      CORS_ORIGIN: http://localhost:3101
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: brotracker
      S3_PUBLIC_URL: http://localhost:9000/brotracker
      BYPARR_URL: http://byparr:8191/v1
      STATIC_DIR: /app/apps/backend/public
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      byparr:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
