services:
  app:
    image: brofrong/brotracker:latest
    platform: linux/amd64
    container_name: brotracker-prod-app
    restart: unless-stopped
    # ports:
    #   - "${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-brotracker}:${POSTGRES_PASSWORD:-brotracker}@postgres:5432/${POSTGRES_DB:-brotracker}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      BYPARR_URL: http://byparr:8191/v1
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      # Omit OIDC_* for local email/password (bootstrap registration).
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
    networks:
      - brotracker
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      byparr:
        condition: service_started

  postgres:
    image: postgres:latest
    container_name: brotracker-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brotracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brotracker}
      POSTGRES_DB: ${POSTGRES_DB:-brotracker}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - brotracker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: brotracker-prod-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - brotracker
    command: server /data --console-address ":9001"

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: brotracker-byparr
    restart: unless-stopped
    shm_size: 1gb
    networks:
      - brotracker
  
volumes:
  postgres_data:
  minio_data:

networks:
  brotracker:
    name: brotracker
    driver: bridge
