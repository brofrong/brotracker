[install]
# Keep a flat node_modules. The production Docker image copies only the
# repo-root node_modules; Bun 1.4 otherwise defaults workspaces to isolated
# installs.
linker = "hoisted"

[fmt]
useTabs = true
sortImports = true
ignorePatterns = [
	"**/routeTree.gen.ts", # Generated by TanStack Router
	"**/styles.css", # Vendor/generated styles
	"**/test/fixtures/**/*.html", # HTML test fixtures for parsing
	"AGENTS.md", # Owner's custom formatting
]

[lint.categories]
correctness = "error"

[lint.rules]
# const declarations of literal arrays used for their type are a common TypeScript idiom.
"@typescript-eslint/no-unused-vars" = "warn"

# react-hooks/exhaustive-deps is intentionally incomplete in some cases;
# functions are recreated on state changes to stay fresh with the latest state.
"react-hooks/exhaustive-deps" = "warn"

# Effects with state mutations are used intentionally for performance and simplicity.
"react-hooks/set-state-in-effect" = "off"

# Variable reassignment in render is used for accumulation patterns.
"react-hooks/immutability" = "off"

# Manual memoization with useState callbacks doesn't require all deps.
"react-hooks/preserve-manual-memoization" = "off"

# JSX in try/catch is intentional for error handling.
"react-hooks/error-boundaries" = "off"

# Template expressions with caught errors are acceptable.
"@typescript-eslint/restrict-template-expressions" = "off"

# iconv-lite doesn't export a default but we use it this way.
"import/default" = "off"

# Vitest supports async test execution.
"@typescript-eslint/no-floating-promises" = "off"

# Objects may be stringified intentionally in error handling.
"@typescript-eslint/no-base-to-string" = "off"

# Type parameters on vi.fn() are optional.
"vitest/require-mock-type-parameters" = "off"

# Void operator usage is sometimes necessary.
"@typescript-eslint/no-meaningless-void-operator" = "off"

# Spread operators are used for object merging intentionally.
"@typescript-eslint/no-misused-spread" = "off"

# Some type unions with unknown are intentional.
"@typescript-eslint/no-redundant-type-constituents" = "off"

# unused expression warnings are too noisy.
"@typescript-eslint/no-unused-expressions" = "off"

# role="progressbar" is used intentionally with ARIA attributes.
"jsx-a11y/prefer-tag-over-role" = "off"
